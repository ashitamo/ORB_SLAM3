%YAML:1.0

File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------

Camera.type: "PinHole"

Camera1.fx: 427.6786193847656
Camera1.fy: 427.6786193847656
Camera1.cx: 426.2860107421875
Camera1.cy: 240.9849090576172

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

Camera.width: 848
Camera.height: 480
Camera.fps: 30

# 0: BGR/灰階輸入
# 1: RGB 輸入
# infra1 是 mono8，因此設 0
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# RGB-D Parameters
#--------------------------------------------------------------------------------------------

# D405 infra stereo baseline，單位為公尺
Stereo.b: 0.017974402815278505

# Close/Far depth threshold，以 baseline 倍數表示
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------

# 已直接沿用驗證成功的 D405 stereo-inertial 外參。
# 不要再次取 inverse。
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.013246093499588, -0.176450775747820,  0.984220333434030,  0.013252775424136,
          -0.999883941202309, -0.009746255920432,  0.011709595265010,  0.004325550794987,
           0.007526296083537, -0.984261212399192, -0.176559396900128,  0.037529161442451,
           0.0,                0.0,                0.0,                1.0 ]

IMU.NoiseGyro: 0.000818996
IMU.NoiseAcc: 0.002856425
IMU.GyroWalk: 0.000005252737902735109
IMU.AccWalk: 0.000021912815561319924
IMU.Frequency: 100.0

# depth topic encoding = 16UC1
# RealSense 深度通常以毫米表示：
# depth_meter = depth_raw / 1000.0
RGBD.DepthMapFactor: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8

ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0

Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

#--------------------------------------------------------------------------------------------
# Atlas save/load
#--------------------------------------------------------------------------------------------

System.SaveAtlasToFile: "D405_rgbd_imu_atlas_map"

